<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PT DARIRIP YAOP</title><style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f3f7f4;color:#18352b}header{background:#176b4d;color:white;padding:22px}main{padding:16px;max-width:650px;margin:auto}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:12px 0}button{background:#176b4d;color:white;border:0;border-radius:8px;padding:10px 13px;font-weight:bold}input{padding:11px;border:1px solid #ccd8d1;border-radius:8px;width:100%;margin:6px 0}.muted{color:#63756c;font-size:13px}.total{font-size:22px;font-weight:bold}</style></head><body>
<header><h2>PT DARIRIP YAOP</h2><div>Aplikasi pemesanan dan penjualan</div></header><main>
<section class="card"><h3>Menu Pembelian</h3><div id="items"></div><p>Nama pembeli</p><input id="buyer" placeholder="Masukkan nama pembeli"><p class="total">Total: <span id="total">Rp0</span></p><button onclick="order()">Buat Pesanan</button><p class="muted">QRIS otomatis belum terhubung. Konfirmasi pembayaran dilakukan oleh pemilik.</p></section>
<section class="card"><h3>Login Pemilik</h3><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Masuk</button><p id="msg" class="muted"></p></section><section class="card"><h3>Daftar Pesanan</h3><div id="orders" class="muted">Belum ada pesanan.</div></section></main>
<script>
const products=[["Cocorun",3000],["Roti Bakar",2000],["Kaki Naga Capucino",1000],["Nyamnyam",5000],["Makaroni",5000]], qty=products.map(()=>0), orders=[];
const rp=n=>"Rp"+n.toLocaleString("id-ID");
function draw(){document.getElementById("items").innerHTML=products.map((p,i)=>`<div class="item"><span><b>${p[0]}</b><br><small>${rp(p[1])}</small></span><span><button onclick="chg(${i},-1)">−</button> ${qty[i]} <button onclick="chg(${i},1)">+</button></span></div>`).join("");document.getElementById("total").textContent=rp(products.reduce((s,p,i)=>s+p[1]*qty[i],0))}
function chg(i,n){qty[i]=Math.max(0,qty[i]+n);draw()}
function order(){let total=products.reduce((s,p,i)=>s+p[1]*qty[i],0);if(!total){alert("Pilih produk dahulu");return}let name=document.getElementById("buyer").value.trim()||"Pembeli";orders.unshift({name,total,date:new Date().toLocaleString("id-ID")});document.getElementById("orders").innerHTML=orders.map(o=>`${o.date} — ${o.name}: ${rp(o.total)}`).join("<br>");alert("Pesanan dicatat. Hubungi pemilik untuk pembayaran.");qty.fill(0);draw()}
function login(){document.getElementById("msg").textContent=(document.getElementById("user").value==="pemilik"&&document.getElementById("pass").value==="coco2026")?"Login demo berhasil.":"Username atau password salah."}draw();
</script></body></html>
